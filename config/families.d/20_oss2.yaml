# OPEN-SOURCE BOT STRATEGIES, SECOND BATCH (added 24 Nov 2026; replayed from the common start 12 Oct 17:00 UTC)
# ---------------------------------------------------------------------------------------------------
# Freqtrade (official freqtrade-strategies repo + two widely copied community files), Gekko and Zenbot
# built-in strategies, Hummingbot V2 directional controllers, a Jesse example and the "hello world"
# examples of backtesting.py, backtrader, vectorbt and QuantConnect Lean. Default parameters and the
# file's own ROI / stoploss / trailing settings, nothing tuned; long only (a short signal = exit to cash);
# Bitvavo fees. Code: src/quantdesk/bots/families/oss2.py. Where a source uses a candle size the data
# feed does not have, the rules say what is used instead.

