    group: investors
    name: Low-volatility stocks on the S&P 500 (Ang, Hodrick, Xing & Zhang 2006; Blitz & van Vliet 2007)
    source: https://papers.ssrn.com/abstract=980865
    rules: 'At each month-end hold the 10% (50) S&P 500 stocks with the lowest 1-year daily volatility, equal weight. Universe: S&P 500 members
      on 18 Aug 2026 (the last membership list before the start).'
    class: EtfWeightBot
    weights: inv_xs_rank
    schedule: calendar
    lookback: 300
    params:
      universe: sp500_20260818
      signal_tickers:
      - SPY
      metric: lowvol
      n: 50
    band: 0.001
  bab_long_sp500:
    group: investors
    name: Betting against beta, long leg, on the S&P 500 (Frazzini & Pedersen 2014)
    source: https://doi.org/10.1016/j.jfineco.2013.10.005
    rules: 'At each month-end hold the 10% (50) S&P 500 stocks with the lowest shrunk beta (0.6 x 1-year daily beta vs SPY + 0.4), equal weight.
      Long only, unlevered (the paper levers the low-beta leg to beta 1 and shorts high beta). Universe: S&P 500 members on 18 Aug 2026 (the last
      membership list before the start).'
    class: EtfWeightBot
    weights: inv_xs_rank
    schedule: calendar
    lookback: 300
    params:
      universe: sp500_20260818
      signal_tickers:
      - SPY
      metric: lowbeta
      n: 50
    band: 0.001
  buffett_9010:
    group: buffett
    name: 'Buffett''s 90/10: 90% S&P 500 index fund, 10% short-term Treasuries (2013 letter)'
    source: https://www.berkshirehathaway.com/letters/2013ltr.pdf (the instructions for his wife's trust)
    rules: '10% of the cash in short-term government bonds and 90% in a very low-cost S&P 500 index fund (Vanguard): VOO 90% / SHY 10%, rebalanced
      on the first trading day of each year.'
    class: EtfWeightBot
    weights: inv_fixed_mix
    schedule: calendar
    params:
      universe:
      - VOO
      - SHY
      mix:
        VOO: 0.9
        SHY: 0.1
      rebalance: yearly
    band: 0.001
  buffett_brk:
    group: buffett
    name: Own Berkshire Hathaway (BRK-B), Buffett's own vehicle
    source: https://www.berkshirehathaway.com/ ; https://www.berkshirehathaway.com/letters/letters.html
    rules: Buy BRK-B at the start and hold.
    class: EtfWeightBot
    weights: inv_fixed_mix
    schedule: calendar
    params:
      universe:
      - BRK-B
      mix:
        BRK-B: 1.0
      rebalance: never
    band: 0.001
  berkshire_13f:
    group: buffett
    name: 'Warren Buffett: 13F clone of BERKSHIRE HATHAWAY INC'
    source: '2026-06-30 13F-HR filed 2026-08-14: https://www.sec.gov/Archives/edgar/data/1067983/000119312526352200/ ; 2026-09-30 13F-HR filed
      2026-11-16: https://www.sec.gov/Archives/edgar/data/1067983/000119312526463399/ ; 13F cloning: Martin & Puthenpurackal, ''Imitation is the
      Sincerest Form of Flattery: Warren Buffett and Berkshire Hathaway'' (SSRN 806246, https://papers.ssrn.com/abstract=806246)'
    rules: 'Copy the fund''s latest 13F-HR filing: the 20 largest long stock/ETF positions by reported value, re-weighted to 100%, bought on the
      first session after the SEC filing date and held until the next filing (options, notes and warrants left out). Start: the Q2 2026 filing
      (public before 12 Oct); then each new filing on the day after it is filed.'
    class: EtfWeightBot
    weights: inv_dated_portfolio
    schedule: calendar
    params:
      universe:
      - AAPL
      - ALLY
      - AXP
      - BAC
      - COF
      - CVX
      - DAL
      - DVA
      - GOOG
      - GOOGL
      - KHC
      - KO
      - KR
      - LEN
      - LLYVA
      - LLYVK
      - MCO
      - NYT
      - OXY
      - SIRI
      - VRSN
      file: 13f_2026.json
      key: berkshire
    band: 0.001
  buffett_greedy_fearful:
    group: buffett
    name: '''Greedy when others are fearful'': all in stocks when fear spikes'
    source: https://www.berkshirehathaway.com/letters/1986.html ; 'Buy American. I Am.' NYT 17 Oct 2008 https://www.nytimes.com/2008/10/17/opinion/17buffett.html
      ; the VIX-above-30 buy signal as quoted in Haghani & White, 'When Fear Spikes, Should You Buy?' (Elm Wealth, Jul 2026) https://elmwealth.com/wp-content/uploads/2026/06/Elm-When-Fear-Spikes-Should-You-Buy.pdf
    rules: 'Normally 60% SPY / 40% short Treasuries (SHY); 100% SPY while fear is high: the VIX closes above 30 (variant VIX30) or the S&P 500
      is 20% or more below its 52-week closing high (variant DD20, Buffett''s Oct 2008 ''Buy American'' moment). Checked daily 5 minutes before
      the close. (The 60/40 base is this test''s choice.)'
    class: EtfWeightBot
    weights: inv_greedy_fearful
    schedule: daily
    band: 0.05
    params:
      universe:
      - SPY
      - SHY
      base: 0.6
    variants:
    - id: VIX30
      params:
        mode: vix
        vix: 30
        signal_tickers:
        - ^VIX
    - id: DD20
      params:
        mode: drawdown
        dd: 0.2
  buffett_small_value:
    group: buffett
    name: Small-cap value, buy and hold (Buffett's Graham-and-Doddsville value; Fama-French small value)
    source: 'Buffett, ''The Superinvestors of Graham-and-Doddsville'' (1984) https://www8.gsb.columbia.edu/sites/valueinvesting/files/files/Buffett1984.pdf
      ; Fama & French (1992) ''The Cross-Section of Expected Stock Returns'', JF ; Buffett 1999 (BusinessWeek): with small sums he could earn
      50% a year in small companies'
    rules: 'Buy one US small-cap value ETF at the start and hold; one bot per ETF: IJS (S&P 600 value), VBR (CRSP small value), AVUV (Avantis),
      SLYV (SPDR S&P 600 value), DFSV (Dimensional).'
    class: EtfWeightBot
    weights: inv_fixed_mix
    schedule: calendar
    params:
      rebalance: never
    variants:
    - id: IJS
      params:
        universe:
        - IJS
        mix:
          IJS: 1.0
    - id: VBR
      params:
        universe:
        - VBR
        mix:
          VBR: 1.0
    - id: AVUV
      params:
        universe:
        - AVUV
        mix:
          AVUV: 1.0
    - id: SLYV
      params:
        universe:
        - SLYV
        mix:
          SLYV: 1.0
    - id: DFSV
      params:
        universe:
        - DFSV
        mix:
          DFSV: 1.0
    band: 0.001
  buffett_alpha_etf:
    group: buffett
    name: 'Buffett''s Alpha with factor ETFs: low beta + quality + value (Frazzini, Kabiller & Pedersen 2018)'
    source: https://papers.ssrn.com/abstract=3197185 (Financial Analysts Journal 74(4), 2018)
    rules: 'The paper explains Berkshire''s returns by its loadings on betting-against-beta, quality-minus-junk and value (plus ~1.6x leverage).
      Long-only, unlevered ETF version: 1/3 each in USMV (minimum volatility), QUAL (quality) and VLUE (value), rebalanced quarterly.'
    class: EtfWeightBot
    weights: inv_fixed_mix
    schedule: calendar
    params:
      universe:
      - USMV
      - QUAL
      - VLUE
      mix:
        USMV: 0.3333333333333333
        QUAL: 0.3333333333333333
        VLUE: 0.3333333333333333
      rebalance: quarterly
    band: 0.001
  buffett_indicator:
    group: buffett
    name: 'The Buffett indicator: total market below 200% of GDP, else T-bills'
    source: 'Buffett & Loomis, ''Warren Buffett on the Stock Market'', Fortune 10 Dec 2001 https://archive.fortune.com/magazines/fortune/fortune_archive/2001/12/10/314691/index.htm
      ; reading of 240.24% on 12 Aug 2026: https://www.mitrade.com/insights/news/live-news/article-8-2102462-20260921'
    rules: Market value / GDP = 240.24% on 12 Aug 2026 (published before the start), carried forward with VTI's price. Hold VTI while the ratio
      is below 200% ('approaching 200% ... you are playing with fire'), otherwise T-bills (SHY). Checked daily.
    class: EtfWeightBot
    weights: inv_buffett_indicator
    schedule: daily
    params:
      universe:
      - VTI
      - SHY
      ref_ratio: 2.4024
      ref_date: '2026-08-12'
      max_ratio: 2.0
  brk_buyback_rule:
    group: buffett
    name: 'Berkshire''s buyback rule: BRK-B below 1.2x book, else the S&P 500 fund'
    source: 'https://fortune.com/2012/12/12/buffetts-buy-changes-berkshire-rules/ (limit raised from 110% to 120% of book, 2012) ; book value:
      Berkshire 10-Qs https://www.sec.gov/Archives/edgar/data/1067983/000119312526341032/ (Q2 2026, filed 10 Aug) and https://www.sec.gov/Archives/edgar/data/1067983/000119312526452412/
      (Q3 2026, filed 9 Nov)'
    rules: 'Buffett and Munger authorised buybacks at up to 120% of book value (2012-2018), the level at which they judged the shares clearly
      undervalued. Hold BRK-B while its price is at most 1.2x the last reported book value per class-B share (Q2 2026: $348.26; Q3 2026: $357.73,
      each usable the day after its 10-Q), otherwise VOO. Checked daily.'
    class: EtfWeightBot
    weights: inv_brk_book
    schedule: daily
    params:
      universe:
      - BRK-B
      - VOO
      max_pb: 1.2
      book:
      - effective: '2026-08-11'
        bvps_b: 348.26
      - effective: '2026-11-10'
        bvps_b: 357.73
  munger_daily_journal:
