    rules: 'At each month-end buy the 10% (50) S&P 500 stocks with the worst 1-month return, equal weight, held for a month. Universe: S&P 500
      members on 18 Aug 2026 (the last membership list before the start).'
    class: EtfWeightBot
    weights: inv_xs_rank
    schedule: calendar
    lookback: 300
    params:
      universe: sp500_20260818
      signal_tickers:
      - SPY
      metric: rev1m
      n: 50
    band: 0.001
