# TRADING BOTS: one-month demo of the strategies most used and recommended online
# ---------------------------------------------------------------------------------
# Each bot trades its own simulated EUR 5,000 account (EUR 1,000 until 13 Oct 2026, when every bot was
# restarted from the 12 Oct start with EUR 5,000), buying and selling on its
# own rules. The engine replays every real market candle in order as it arrives (15-minute,
# 1-hour or 5-minute candles from Bitvavo / Kraken / Yahoo), so a bot's decision on a candle
# only ever sees data up to that candle, and resting orders (grid levels, take-profits, stops)
# fill when a later candle trades through them - the same thing an exchange would do.
#
# Costs charged on every fill:
#   crypto (Bitvavo EUR markets, lowest tier): 0.15% maker (resting limit orders), 0.25% taker
#     (market and stop orders) + half the bid-ask spread + slippage on taker orders
#   US stocks (IBKR Tiered): USD 0.0035/share, USD 0.35 minimum, exchange/clearing/SEC fees,
#     0.03% EUR->USD conversion, spread + slippage on market and stop orders
# At the end of the month every bot sells what it holds at market, so the result is realised.

start: "2026-10-12T17:00:00Z"
end: "2026-12-31T17:00:00Z"
review: "2026-11-12T17:00:00Z"        # mid-point review (one month)
initial_capital: 5000.0

markets:
  BTC_SPOT: {symbol: BTC/EUR, half_spread_bps: 2, slippage_bps: 3}
  ETH_SPOT: {symbol: ETH/EUR, half_spread_bps: 3, slippage_bps: 3}
  SOL_SPOT: {symbol: SOL/EUR, half_spread_bps: 5, slippage_bps: 5}
  XRP_SPOT: {symbol: XRP/EUR, half_spread_bps: 5, slippage_bps: 5}
  DOGE_SPOT: {symbol: DOGE/EUR, half_spread_bps: 8, slippage_bps: 8}
  ADA_SPOT: {symbol: ADA/EUR, half_spread_bps: 8, slippage_bps: 8}
  LINK_SPOT: {symbol: LINK/EUR, half_spread_bps: 8, slippage_bps: 8}
  AVAX_SPOT: {symbol: AVAX/EUR, half_spread_bps: 10, slippage_bps: 10}
  # added for the strategy families (cross-sectional crypto papers use 18 coins)
  DOT_SPOT: {symbol: DOT/EUR, half_spread_bps: 10, slippage_bps: 10}
  LTC_SPOT: {symbol: LTC/EUR, half_spread_bps: 8, slippage_bps: 8}
  BCH_SPOT: {symbol: BCH/EUR, half_spread_bps: 10, slippage_bps: 10}
  ATOM_SPOT: {symbol: ATOM/EUR, half_spread_bps: 12, slippage_bps: 12}
  UNI_SPOT: {symbol: UNI/EUR, half_spread_bps: 12, slippage_bps: 12}
  NEAR_SPOT: {symbol: NEAR/EUR, half_spread_bps: 12, slippage_bps: 12}
  TRX_SPOT: {symbol: TRX/EUR, half_spread_bps: 10, slippage_bps: 10}
  XLM_SPOT: {symbol: XLM/EUR, half_spread_bps: 10, slippage_bps: 10}
  ETC_SPOT: {symbol: ETC/EUR, half_spread_bps: 12, slippage_bps: 12}
  FIL_SPOT: {symbol: FIL/EUR, half_spread_bps: 12, slippage_bps: 12}

crypto_fees: {maker: 0.0015, taker: 0.0025}     # Bitvavo, checked 2026-10-10
stock_costs: {half_spread_bps: 3, slippage_bps: 2}

# Two groups: "popular" = the strategies bot platforms and trading communities rank highest;
# "alternative" = less common strategies with published, rule-based definitions (added 12 Oct 2026,
# before the test started; rules taken from the sources as published, no tuning on data);
# "classic" = textbook trader systems and documented market anomalies, incl. a leveraged ETF
# (added 12 Oct 2026 at 17:20 UTC, 20 minutes into the test; they replay from the same start).
bots:

  grid_btc:
    group: popular
    name: "Grid bot on BTC/EUR (Pionex / Binance / Bybit spot grid)"
    class: GridBot
    timeframe: 15m
    source: >
      The spot grid is the most widely used bot type on Pionex, Binance and Bybit, and the first
      item in most "best crypto bot" lists (e.g. gainium.io/best/grid, bingx.com "Top 10 crypto
      trading bots of 2026"). It profits from price oscillation inside a range.
    rules: |
      SETUP  16 geometric grid levels from -8% to +8% around the starting price (~1% apart);
             equal EUR amount per level; buys the BTC needed for the sell levels above the price
      BUY    resting limit order at each level below the price
      SELL   every filled buy gets a resting limit sell one level higher (+~1%)
      RESET  if the price stays outside the range for 24 hours, sell everything and rebuild the
             grid around the current price (a "trailing" grid)
    params: {instrument: BTC_SPOT, levels: 16, range_pct: 0.08, reset_hours: 24, invest: 0.98}

  dca_eth:
    group: popular
    name: "DCA bot with safety orders on ETH/EUR (3Commas-style)"
    class: DCABot
    timeframe: 15m
    source: >
      The DCA bot with safety orders is the signature bot of 3Commas and is offered by Pionex,
      Bitsgap and Gainium (gainium.io/best/dca). Settings below are the common community template:
      1.5% take-profit, safety orders 1.5% apart with volume scale 1.5 and step scale 1.2.
    rules: |
      BUY    base order of EUR 350 at market as soon as no deal is open ("start ASAP")
      BUY    up to 5 safety orders below the entry: first at -1.5%, each next step 1.2x wider,
             each order 1.5x larger (350, 350, 525, 788, 1,181, 1,772 EUR; covers a ~11% drop)
      SELL   take-profit limit order at +1.5% above the average entry price, moved after every
             safety order; when it fills, a new deal starts on the next candle
      STOP   none (classic template)
    params: {instrument: ETH_SPOT, base_eur: 350, so_eur: 350, max_so: 5, deviation: 0.015,
             step_scale: 1.2, volume_scale: 1.5, take_profit: 0.015}

  bb_meanrev:
    group: popular
    name: "BinHV45 Bollinger mean reversion on 8 coins (Freqtrade community strategy)"
    class: BinHV45Bot
    timeframe: 15m
    source: >
      BinHV45 is one of the most copied strategies in the Freqtrade community repositories
      (e.g. github.com/freqtrade/freqtrade-strategies and many forks). Rules and hyper-parameters
      are taken verbatim from the published file; 15-minute candles as in the original.
    rules: |
      BUY    the candle closes below the previous lower Bollinger band (40, 2), the band is wide
             (mid-lower > 0.7% of price), the close moved > 1.7% of price, the lower wick is small
             (< 25% of the band width) and the close is not above the previous close
      SELL   take-profit limit +1.25% above entry (Freqtrade minimal_roi)
      STOP   -5% stop-loss
      SIZE   up to 3 open trades (Freqtrade max_open_trades), one third of equity each, at most one
             per coin; scans 8 liquid EUR pairs as Freqtrade setups usually run on a pair list
    params: {instruments: [BTC_SPOT, ETH_SPOT, SOL_SPOT, XRP_SPOT, DOGE_SPOT, ADA_SPOT, LINK_SPOT, AVAX_SPOT],
             max_open_trades: 3, bb_window: 40, bb_std: 2.0, bbdelta: 7, closedelta: 17, tail: 25,
             roi: 0.0125, stoploss: 0.05}

  supertrend:
    group: popular
    name: "Supertrend (10, 3) trend following on BTC/ETH/SOL, 1-hour"
    class: SupertrendBot
    timeframe: 1h
    source: >
      Supertrend is among the most-used community indicators and strategies on TradingView
      (trend-following family in pickmytrade.io's comparison of TradingView strategies).
      ATR 10 and multiplier 3 are the TradingView defaults.
    rules: |
      BUY    when Supertrend(10, 3) flips to an uptrend (close above the band)
      SELL   when it flips back to a downtrend
      SIZE   one third of equity per coin, long only, no leverage
    params: {instruments: [BTC_SPOT, ETH_SPOT, SOL_SPOT], atr_period: 10, multiplier: 3.0}

  ema_macd:
    group: popular
    name: "EMA 9/21 crossover + MACD confirmation, EMA200 filter, ATR stop (1-hour)"
    class: EmaMacdBot
    timeframe: 1h
    source: >
      The moving-average crossover confirmed by MACD and filtered by the 200 EMA is the
      textbook combination recommended in most strategy guides (pickmytrade.io: combine crossovers
      with a trend filter); 9/21 and MACD 12/26/9 are the standard settings.
    rules: |
      BUY    EMA(9) crosses above EMA(21), MACD(12,26,9) line above its signal line, close > EMA(200)
      SELL   EMA(9) crosses below EMA(21)
      STOP   2 x ATR(14) below the entry
      SIZE   one third of equity per coin, long only
    params: {instruments: [BTC_SPOT, ETH_SPOT, SOL_SPOT], fast: 9, slow: 21, trend: 200,
             atr_period: 14, stop_atr: 2.0}

  orb_stocks:
    group: popular
    name: "Opening Range Breakout on US 'stocks in play' (Zarattini, Barbon & Aziz 2024), IBKR"
    class: ORBBot
    timeframe: 5m
    source: >
      "A Profitable Day Trading Strategy for the U.S. Equity Market" (Zarattini, Barbon & Aziz,
      2024; concretumgroup.com) reports a 5-minute opening range breakout on the 20 most active
      'stocks in play' with a 2.81 Sharpe ratio for 2016-2023; replicated on QuantConnect. Adapted
      here for a EUR 5,000 cash account: long only, no leverage, 5 names.
    rules: |
      SELECT at 09:35 New York time, the 5 names (of the 100 most liquid S&P 500 stocks) with the
             highest volume in the first 5 minutes relative to their 14-day average, whose first
             candle closed up
      BUY    stop order at the high of the first 5-minute candle
      STOP   10% of the 14-day ATR below the entry
      SELL   everything at the close of the session (no overnight positions)
      SIZE   one fifth of equity per name
    params: {n_names: 5, rel_volume_days: 14, atr_days: 14, stop_atr_frac: 0.10, min_price: 5.0}

  # ------------------------------------------------------------------------------ alternative strategies

  vol_breakout:
    group: alternative
    name: "Volatility breakout on BTC/ETH/XRP (Larry Williams, as run by Korean Upbit bots)"
    class: VolBreakoutBot
    timeframe: 15m
    source: >
      Larry Williams' volatility breakout is the standard first bot of the Korean crypto community
      (Upbit, pyupbit tutorials; wikidocs.net "파이썬을 이용한 비트코인 자동매매", target =
      today's open + (yesterday's high - yesterday's low) x 0.5). Rarely seen in Western bot lists.
    rules: |
      DAY    00:00-24:00 UTC (= 09:00-09:00 Korea time, Upbit's daily candle)
      BUY    stop order at today's open + 0.5 x yesterday's range (high - low); fills when the price
             breaks above it during the day
      SELL   everything at the next day's open (00:00 UTC); an unfilled buy order expires
      SIZE   one third of equity per coin, long only
    params: {instruments: [BTC_SPOT, ETH_SPOT, XRP_SPOT], k: 0.5}

  btc_night:
    group: alternative
    name: "Bitcoin time-of-day seasonality: hold 21:00-23:00 UTC only (Quantpedia)"
    class: TimeOfDayBot
    timeframe: 1h
    source: >
      Quantpedia, "Are There Seasonal Intraday or Overnight Anomalies in Bitcoin?" (2022) and
      "The Seasonality of Bitcoin" (2023 update): the highest average hourly returns fall at 22:00
      and 23:00 UTC; the rule "buy at 21:00, sell at 23:00 UTC" earned ~33-41% a year in 2015-2023
      before costs. The published tests ignore fees, which this test charges on ~60 trades.
    rules: |
      BUY    all cash into BTC at 21:00 UTC (market order)
      SELL   everything at 23:00 UTC (market order)
      Otherwise flat: in cash 22 hours a day
    params: {instrument: BTC_SPOT, entry_hour: 21, exit_hour: 23}

  rebalance:
    group: alternative
    name: "Rebalancing bot, equal-weight BTC/ETH/SOL/XRP (Pionex / Shrimpy style)"
    class: RebalanceBot
    timeframe: 15m
    source: >
      Rebalancing bots (Pionex "Rebalancing Bot", KuCoin "Smart Rebalance", Shrimpy) keep fixed
      target weights and sell what has risen to buy what has fallen. Pionex rebalances when a coin's
      weight drifts past a threshold; its help page example is a 10% weight rebalanced at 10.25% or
      9.75%, i.e. 2.5% of the target weight, used here.
    rules: |
      SETUP  25% in each of BTC, ETH, SOL, XRP (1% kept in cash for fees)
      REBAL  when any coin's weight is more than 2.5% away from its target (e.g. above 25.37% or below
             24.13%), sell the overweight coins and buy the underweight ones back to the targets
             (market orders; trades under the EUR 5 exchange minimum are skipped)
    params: {instruments: [BTC_SPOT, ETH_SPOT, SOL_SPOT, XRP_SPOT], band: 0.025, cash_buffer: 0.01}

  momentum_rotation:
    group: alternative
    name: "Momentum rotation: all-in on the best coin of the last 24h (Pionex Momentum Rebalancing)"
    class: MomentumRotationBot
    timeframe: 1h
    source: >
      Pionex's "Momentum Rebalancing" mode: at each interval the bot ranks the coins by performance and
      moves all funds into the top one. Pionex's example uses 4 hours; at 4 hours the fees of up to six
      switches a day would dominate, so this test uses the daily interval.
    rules: |
      EVERY  day at 00:00 UTC, rank BTC, ETH, SOL, XRP, DOGE, ADA, LINK, AVAX by their 24-hour return
      SWITCH if the best coin is not the one held: sell it and buy the best one (market orders)
    params: {instruments: [BTC_SPOT, ETH_SPOT, SOL_SPOT, XRP_SPOT, DOGE_SPOT, ADA_SPOT, LINK_SPOT, AVAX_SPOT],
             interval_hours: 24}

  ibs_etf:
    group: alternative
    name: "Internal Bar Strength mean reversion on SPY/QQQ/IWM/DIA (US index ETFs), IBKR"
    class: IBSBot
    timeframe: 5m
    source: >
      IBS = (close - low) / (high - low) of the day. Buying index ETFs that close near the day's low
      and selling when they close near the high is a documented short-term edge (quantifiedstrategies.com
      IBS articles; TradingView "Internal Bar Strength (IBS) Strategy", default thresholds 0.2 / 0.8).
      Note: EU retail accounts cannot buy US-domiciled ETFs (PRIIPs rules); the same trades would be
      done with UCITS index ETFs or index options. The simulation uses the US ETFs' prices and IBKR fees.
    rules: |
      WHEN   5 minutes before the US close, using the day's high, low and price so far
      BUY    IBS below 0.2 (market order at 15:55 New York time)
      SELL   IBS at or above 0.8 (market order at 15:55 New York time)
      SIZE   one quarter of equity per ETF, long only; positions are held overnight
    params: {instruments: [SPY, QQQ, IWM, DIA], entry: 0.2, exit: 0.8}

  # ------------------------------------------------------------------------------ classic systems and anomalies

  turtle_crypto:
    group: classic
    name: "Turtle Traders System 1 breakout on BTC/ETH/SOL, 4-hour"
    class: TurtleBot
    timeframe: 4h
    source: >
      The Turtle Traders' System 1 (Dennis & Eckhardt, 1983; published in Curtis Faith's "The Original
      Turtle Trading Rules"): 20-period breakout entry, 10-period exit, 2N stop. Originally daily
      futures; run here on 4-hour crypto candles so that it trades within a month.
    rules: |
      BUY    stop order 0.01% above the highest high of the last 20 candles
      SELL   stop at the higher of the lowest low of the last 10 candles and entry - 2 x N
             (N = ATR(20) when the order was placed); moved up every candle
      SIZE   one third of equity per coin, long only
    params: {instruments: [BTC_SPOT, ETH_SPOT, SOL_SPOT], entry_n: 20, exit_n: 10, atr_n: 20, stop_n: 2.0}

  squeeze:
    group: classic
    name: "Squeeze Momentum (LazyBear) on BTC/ETH/SOL, 1-hour"
    class: SqueezeBot
    timeframe: 1h
    source: >
      LazyBear's Squeeze Momentum indicator (John Carter's TTM Squeeze) is one of the most-used community
      indicators on TradingView. A squeeze is Bollinger bands (20, 2) inside the Keltner channel
      (20, 1.5 x range); the traditional trade is the first bar after it "fires", in the direction
      of the momentum histogram, exiting when the histogram fades (luxalgo.com library description).
    rules: |
      BUY    the squeeze turns off on this candle and the momentum value is positive and rising
      SELL   the momentum value falls below the previous candle's
      SIZE   one third of equity per coin, long only
    params: {instruments: [BTC_SPOT, ETH_SPOT, SOL_SPOT]}

  rsi_classic:
    group: classic
    name: "RSI(14) 30/70 on BTC/ETH/SOL, 1-hour"
    class: RSIBot
    timeframe: 1h
    source: >
      The textbook Welles Wilder RSI rule, and the default "RSI" signal bot on 3Commas, Pionex and
      Cryptohopper: buy oversold, sell overbought.
    rules: |
      BUY    RSI(14) below 30
      SELL   RSI(14) above 70
      SIZE   one third of equity per coin, long only, no stop
    params: {instruments: [BTC_SPOT, ETH_SPOT, SOL_SPOT], period: 14, buy_below: 30, sell_above: 70}

  overnight_spy:
    group: classic
    name: "Overnight anomaly: own SPY from the close to the next open, IBKR"
    class: OvernightBot
    timeframe: 5m
    source: >
      Most of the S&P 500's long-run gain has come overnight, between the close and the next open
      (QuantConnect strategy library "Overnight Anomaly", Quantpedia, Alpha Architect). QuantConnect
      notes that IBKR fees cancel most of it; this test charges those fees.
    rules: |
      BUY    SPY at 15:55 New York time (market order, ~5 minutes before the close)
      SELL   at the next session's open (market order)
      SIZE   all equity
    params: {instruments: [SPY]}

  turn_of_month:
    group: classic
    name: "Turn-of-the-month effect on SPY, IBKR"
    class: TurnOfMonthBot
    timeframe: 5m
    source: >
      Stocks have earned most of their return over the last trading days of a month and the first days
      of the next (Ariel 1987; Quantpedia; quantifiedstrategies.com tests "the last four and first three
      trading days"). In this test window that is one trade: end of October into early November.
    rules: |
      BUY    SPY at 15:55 New York time on the day with 4 trading days left in the month
      SELL   at 15:55 on the 3rd trading day of the next month
      SIZE   all equity
    params: {instruments: [SPY], days_before_end: 4, exit_day: 3}

  leverage_rotation:
    group: classic
    name: "Leverage rotation: 2x S&P 500 (SSO) above the 200-day average, else cash (Gayed & Bilello)"
    class: LeverageRotationBot
    timeframe: 5m
    source: >
      Gayed & Bilello, "Leverage for the Long Run" (2016, NAAIM/CMT award): hold the S&P 500 with 2x
      leverage while it is above its 200-day moving average, T-bills (here cash, no interest) below.
      SSO is the 2x daily-leveraged S&P 500 ETF. This is the test's leveraged agent.
    rules: |
      CHECK  every day at 15:55 New York time: SPY's price against its 200-day average (today's
             price counted as today's close)
      BUY    all equity in SSO when SPY is above the average
      SELL   all SSO when SPY falls below it
    params: {instrument: SSO, signal: SPY, sma_days: 200}
