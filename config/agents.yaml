# PRE-REGISTERED AGENT SPECIFICATIONS (v2: explicit indicator buy/sell rules + stops/targets)
# ------------------------------------------------------------------------------------------
# Written and committed before any backtest on real data was run (see git history; v1 was replaced
# before it was ever run on real data).
# Rules: parameters below are literature defaults, not fitted. Every backtest of a
# changed parameter set counts as a new trial and is appended to reports/trials.csv,
# which feeds the Deflated Sharpe Ratio. The `main` configuration is the one that is
# paper-traded, whatever the robustness variants show (no picking the best variant).
#
# Each agent starts with its own isolated EUR 1,000 account.

version: 2
base_currency: EUR
initial_capital: 1000.0

backtest:
  stress_levels: [0.0, 1.0, 2.0]       # 0 = gross (no fees/spread/slippage), 1 = modelled costs, 2 = doubled costs
  end: null                            # null = latest available data
  gate:
    min_sharpe_at_2x_costs: 0.0        # FAIL if net Sharpe at 2x costs <= 0
    ex_best_year_cagr_min: 0.0         # FAIL if the result disappears once the best calendar year is removed
    pass_dsr: 0.95                     # PASS needs Deflated Sharpe Ratio >= 0.95; otherwise WEAK

paper:
  enabled: true                        # switched on 2026-10-12 after the first real-data backtest
  length_days: 31
  # Daily signals use completed daily bars and act on the first cycle >= 30 min after the market opens.
  # Stop-loss / take-profit levels are checked on EVERY cycle (hourly) while the market is open.
  market_settle_minutes: 30           # first trading cycle >= 30 min after the open (delayed quotes settle)
  pending_order_max_age_hours: 6       # an order rejected for lack of a usable quote is retried for at most 6 h
  max_orders_per_agent_per_run: 25

agents:

  bench_sp500:
    name: "B0 Benchmark: S&P 500 UCITS ETF, buy and hold"
    class: BuyAndHold
    calendar: XETR
    params: {instrument: SP500, cash_buffer: 0.01}
    risk: {}
    backtest_start: "2011-01-01"

  bench_btc:
    name: "B1 Benchmark: Bitcoin spot, buy and hold"
    class: BuyAndHold
    calendar: CRYPTO
    params: {instrument: BTC_SPOT, cash_buffer: 0.005}
    risk: {}
    backtest_start: "2018-03-01"

  trend_etf:
    name: "A1 ETF trend: SMA 50/200 + 12-month momentum, ATR trailing stop (IBKR)"
    class: TrendETF
    calendar: XETR
    thesis: >
      Time-series momentum across asset classes (Moskowitz, Ooi & Pedersen 2012; Faber 2007). Buy an
      asset in an established uptrend, exit on a death cross or a trailing stop.
    rules: |
      BUY  when close > SMA(50) > SMA(200), the 12-month return (ROC 252) > 0, and the close is a new
           20-day closing high (entry trigger; also prevents instant re-entry after a stop-out)
      SELL when SMA(50) < SMA(200)
      STOP chandelier trailing stop: highest close since entry - 3 x ATR(20), checked hourly
      SIZE risk 1% of equity between entry and stop, max 30% of equity per ETF, whole shares
    params:
      instruments: [WORLD_EQ, EM_EQ, EUR_GOVT, GOLD, COMMOD]
      sma_fast: 50
      sma_slow: 200
      roc_window: 252
      breakout_window: 20
      atr_window: 20
      stop_atr: 3.0
      risk_per_trade: 0.01
      max_position: 0.30
      min_trade_eur: 25
    risk: {max_drawdown: 0.15, daily_loss: 0.05, max_gross: 1.0}
    backtest_start: "2011-01-01"
    variants:
      stop_2atr: {stop_atr: 2.0}

  trend_etf_t212:
    name: "A1b Same ETF trend rules, Trading 212 cost model"
    class: TrendETF
    calendar: XETR
    venue_override: t212
    thesis: Identical rules to A1 at a commission-free broker with fractional shares; isolates what fees cost at EUR 1,000.
    rules: same as A1
    params:
      instruments: [WORLD_EQ, EM_EQ, EUR_GOVT, GOLD, COMMOD]
      sma_fast: 50
      sma_slow: 200
      roc_window: 252
      breakout_window: 20
      atr_window: 20
      stop_atr: 3.0
      risk_per_trade: 0.01
      max_position: 0.30
      min_trade_eur: 25
    risk: {max_drawdown: 0.15, daily_loss: 0.05, max_gross: 1.0}
    backtest_start: "2011-01-01"

  factor_equity:
    name: "A2 Stock factor ranking + SMA(200) filter, ATR trailing stop (US large caps, IBKR)"
    class: FactorEquity
    calendar: XNYS
    thesis: >
      Long-only tilt toward stocks that rank well on 12-1 month momentum, EBITDA/EV and quality
      (ROE, gross margin, low leverage). Expect heavy post-publication decay (McLean & Pontiff 2016).
    rules: |
      BUY  monthly: top-10 composite rank (momentum + value + quality z-scores) AND close > SMA(200)
      SELL monthly: a holding drops out of the top 25% of the ranking
      STOP chandelier trailing stop: highest close since entry - 3 x ATR(20), checked hourly
      SIZE equal weight, 10 names, fractional shares
    params:
      exclude_sectors: [Financials, Real Estate]
      min_price: 10.0
      min_median_dollar_volume: 50000000
      adv_window: 60
      momentum_lookback: 252
      momentum_skip: 21
      factors: [momentum, value, quality]
      winsor: 0.05
      n_holdings: 10
      sell_rank_pct: 0.25
      trend_sma: 200
      atr_window: 20
      stop_atr: 3.0
      quarterly_resize_band: 0.30
      cash_buffer: 0.01
      min_fundamentals_coverage: 0.70
    risk: {max_drawdown: 0.20, daily_loss: 0.06, max_gross: 1.0}
    backtest_start: "2008-01-01"
    backtest_note: >
      Free data has no point-in-time fundamentals, so the backtest can only test the momentum leg,
      on point-in-time S&P 500 membership (no sector exclusion and no price floor in the backtest,
      because only today's sectors and adjusted prices are available). Delisted names are often
      missing from Yahoo, which biases the backtest upward; coverage is reported. The UCITS
      factor-ETF proxy (factor_ucits_proxy) is the honest check on what a multi-factor tilt earned.
    variants:
      holdings_20: {n_holdings: 20}

  factor_ucits_proxy:
    name: "R1 Research only: UCITS factor ETFs (momentum/value/quality), equal weight"
    class: StaticWeights
    calendar: XETR
    paper: false
    params:
      weights: {MOM_WORLD: 0.333, VAL_WORLD: 0.333, QUAL_WORLD: 0.333}
      rebalance: quarterly
      drift_band: 0.20
      max_cost_frac: 0.02
      min_trade_eur: 25
    risk: {}
    backtest_start: "2015-01-01"

  crypto_trend:
    name: "A3 Crypto breakout: Donchian 20/10 with 2N stop (BTC/ETH perps, Kraken EEA, 1x)"
    class: DonchianBreakout
    calendar: CRYPTO
    thesis: >
      Crypto shows strong time-series momentum; channel breakouts (the Turtle system) are the
      classic way to trade it. Perps at <=1x for low fees; funding is paid while long.
    rules: |
      BUY  when the daily close breaks above the highest high of the previous 20 days
      SELL when the daily close breaks below the lowest low of the previous 10 days
      STOP 2 x ATR(20) below entry ("2N"), checked hourly
      SIZE risk 1% of equity per N (so a stop costs ~2%), max 50% of equity per coin, total <= 1x
    params:
      instruments: [BTC_PERP, ETH_PERP]
      entry_window: 20
      exit_window: 10
      atr_window: 20
      stop_atr: 2.0
      risk_per_trade: 0.01
      max_position: 0.50
      max_leverage: 1.0
      min_trade_eur: 20
    risk: {max_drawdown: 0.30, daily_loss: 0.12, max_gross: 1.0}
    backtest_start: "2018-03-01"
    variants:
      donchian_55_20: {entry_window: 55, exit_window: 20}

  rsi2_meanrev:
    name: "A7 RSI(2) mean reversion on the S&P 500 UCITS ETF (Trading 212)"
    class: RSI2MeanReversion
    calendar: XETR
    venue_override: t212
    thesis: >
      Short-term pullbacks inside a long-term uptrend tend to revert (Connors & Alvarez). The edge is
      small and decayed since publication; it only has a chance with zero commissions.
    rules: |
      BUY  when close > SMA(200) and RSI(2) < 10
      SELL when the daily close > SMA(5)
      TAKE-PROFIT resting at the 5-day average while that average is above the entry price, checked hourly
      STOP 3 x ATR(10) below entry, checked hourly; TIME EXIT after 10 business days
      SIZE 95% of equity, fractional shares
    params:
      instrument: SP500
      trend_sma: 200
      rsi_window: 2
      rsi_entry: 10
      exit_sma: 5
      atr_window: 10
      stop_atr: 3.0
      max_days: 10
      allocation: 0.95
    risk: {max_drawdown: 0.15, daily_loss: 0.06, max_gross: 1.0}
    backtest_start: "2011-01-01"
    variants:
      rsi_5: {rsi_entry: 5}

  funding_carry:
    name: "A4 Funding carry: long spot / short perp when funding > 12%/yr (Bitvavo + Kraken)"
    class: FundingCarry
    calendar: CRYPTO
    thesis: >
      Harvest positive perpetual funding with a delta-neutral position, but only when funding is
      high enough to pay for entry and exit. Expected to sit in cash for long stretches in 2026.
    rules: |
      BUY  spot + SELL the same quantity of perp when the 7-day average funding > 12%/yr
      EXIT both legs when the 7-day average < 4%/yr or the last 24h average funding is negative
      COLLATERAL if the perp account goes above 2x, sell spot and buy back perp to return to 1x
    params:
      pairs: {BTC: {spot: BTC_SPOT, perp: BTC_PERP}, ETH: {spot: ETH_SPOT, perp: ETH_PERP}}
      entry_annualised: 0.12
      exit_annualised: 0.04
      exit_negative_hours: 24
      avg_window_days: 7
      spot_fraction: 0.5
      max_perp_leverage: 2.0
      min_trade_eur: 50
    risk: {max_drawdown: 0.10, daily_loss: 0.05, max_gross: 1.10}
    backtest_start: "2020-01-01"
    variants:
      entry_8pct: {entry_annualised: 0.08}

  vrp_spreads:
    name: "A5 Put credit spreads on XSP: VIX filter, 50% take-profit, 2x stop (IBKR)"
    class: PutCreditSpreads
    calendar: XNYS
    thesis: >
      Index implied volatility exceeds realised volatility on average, so selling index puts earns
      a premium (Cboe PUT index). At EUR 1,000 only defined-risk spreads are acceptable.
    rules: |
      SELL a ~16-delta XSP put 30-45 days out and BUY a put ~0.5% of the index lower, at most weekly,
      only when 13 <= VIX <= its 1-year 95th percentile
      TAKE-PROFIT when the spread can be bought back for <= 50% of the credit (checked hourly)
      STOP-LOSS when it costs >= 2x the credit, or the index trades at/below the short strike (hourly)
      TIME EXIT at 21 days to expiry
      SIZE total max loss of open spreads <= 35% of equity
    params:
      underlying: XSP
      dte_min: 30
      dte_max: 45
      short_delta: 0.16
      width_pct: 0.005
      take_profit: 0.50
      stop_multiple: 2.0
      exit_dte: 21
      close_on_breach: true
      max_risk_frac: 0.35
      max_open: 3
      entry_gap_days: 5
      vix_min: 13.0
      vix_max_pctile: 0.95
      min_credit_cost_multiple: 2.0
      model_atm_iv_ratio: 0.90
      model_skew_per_pct: 1.0
      model_dividend_yield: 0.013
      model_half_spread_min: 0.025
      model_half_spread_frac: 0.015
    risk: {max_drawdown: 0.25, daily_loss: 0.15}
    backtest_start: "2008-01-01"
    backtest_note: >
      Option prices are SYNTHETIC (Black-Scholes on VIX with a fixed skew and a spread model).
      Results are indicative of the mechanics and cost drag, not evidence of an edge.
    variants:
      delta_10: {short_delta: 0.10}

  llm_news:
    name: "A6 LLM news: Claude-labelled headlines, 7% stop / 10% target / 5-day exit (IBKR)"
    class: LLMNews
    calendar: XNYS
    thesis: >
      Controlled experiment: Claude turns headlines into structured events (via a daily scheduled
      task, no paid API); fixed rules decide. Bias-controlled studies (FINSABER, StockBench) say
      this probably does not beat buy-and-hold.
    rules: |
      BUY  up to 3 names whose headline is labelled materiality >= 2 and direction +1, with a
           positive 1-month return; one third of equity each
      STOP 7% below entry; TAKE-PROFIT 10% above entry; TIME EXIT after 5 business days (hourly checks)
    params:
      universe_size: 100
      lookback_hours: 24
      min_materiality: 2
      momentum_window: 21
      max_positions: 3
      hold_days: 5
      stop_loss: 0.07
      take_profit: 0.10
      cash_buffer: 0.01
    risk: {max_drawdown: 0.20, daily_loss: 0.08, max_gross: 1.0}
    backtest: false
    backtest_note: >
      Not backtestable honestly: no point-in-time news archive, and the model was trained on the
      historical period. Forward (paper) test only.
