# Tradable and reference instruments.
#
# yf:         Yahoo Finance symbols, tried in order; the first one that returns data is used.
# proxy:      older series whose daily returns are spliced in BEFORE the instrument's first
#             trading day, to lengthen backtests. Never used in the live paper run.
# lot_size:   1 = whole units only, 0 = fractional allowed.
# half_spread_bps: fallback half bid-ask spread used when no live bid/ask is available.
# venue:      key into venues.yaml (fee schedule).
# calendar:   XETR (Xetra), XNYS (NYSE), CRYPTO (24/7).

# ---------------------------------------------------------------- UCITS ETFs (EUR, Xetra)
SP500:
  kind: etf
  description: Vanguard S&P 500 UCITS ETF (USD) Accumulating, Xetra, EUR
  currency: EUR
  venue: ibkr_xetra
  calendar: XETR
  lot_size: 1
  half_spread_bps: 5
  yf: [VUAA.DE]
  proxy: {yf: SXR8.DE, currency: EUR}

