# ---------------------------------------------------------------- Crypto
# Spot: fees modelled on Bitvavo (MiCA-licensed, EUR markets); live prices from Kraken's EUR book.
BTC_SPOT:
  kind: crypto_spot
  description: Bitcoin vs EUR (Bitvavo fee schedule, Kraken BTC/EUR quotes)
  currency: EUR
  venue: bitvavo_spot
  calendar: CRYPTO
  lot_size: 0
  half_spread_bps: 3
  yf: [BTC-EUR]
  ccxt: {exchange: kraken, symbol: BTC/EUR}

ETH_SPOT:
  kind: crypto_spot
  description: Ether vs EUR (Bitvavo fee schedule, Kraken ETH/EUR quotes)
  currency: EUR
  venue: bitvavo_spot
  calendar: CRYPTO
  lot_size: 0
  half_spread_bps: 4
  yf: [ETH-EUR]
  ccxt: {exchange: kraken, symbol: ETH/EUR}

# Perpetuals: Kraken Pro EEA multi-collateral perps, USD-quoted. Funding accrues to the holder.
BTC_PERP:
  kind: perp
  description: Kraken EEA BTC/USD perpetual (PF_XBTUSD)
  currency: USD
  venue: kraken_eea_perp
  calendar: CRYPTO
  lot_size: 0
  half_spread_bps: 1
  yf: [BTC-USD]
  ccxt: {exchange: krakenfutures, symbol: BTC/USD:USD}
  funding:
    - {source: krakenfutures, symbol: BTC/USD:USD}
    - {source: hyperliquid, symbol: BTC/USDC:USDC}
    - {source: binance_vision, symbol: BTCUSDT}

ETH_PERP:
  kind: perp
  description: Kraken EEA ETH/USD perpetual (PF_ETHUSD)
  currency: USD
  venue: kraken_eea_perp
  calendar: CRYPTO
  lot_size: 0
  half_spread_bps: 1
  yf: [ETH-USD]
  ccxt: {exchange: krakenfutures, symbol: ETH/USD:USD}
  funding:
    - {source: krakenfutures, symbol: ETH/USD:USD}
    - {source: hyperliquid, symbol: ETH/USDC:USDC}
    - {source: binance_vision, symbol: ETHUSDT}

