    rules: "4-hour candles. Signal: a Klinger oscillator reversal (KVO 35/55 vs EMA13) confirmed by an RSI(14) low just reached; RSI averages pick a price weight and a volume weight. Each signal places a limit buy 0.5% below the close for 50% of available cash x 0.5/0.7/1.0, and each fill gets 3 equal limit sells up to +4/+7/+10%. No stop loss; positions can overlap."
    class: DipAnalyserBot
    timeframe: 4h
