    rules: "Long when Bollinger %B (100, 2) < 0 while MACD (21, 42, 9) is below zero with a positive histogram. Triple barrier from the controller defaults: stop -3%, take profit +2%, time limit 45 minutes. 5-minute candles (source default 3 minutes); spot at 1x; one full-size position instead of up to two half-size executors."
