    source: "https://github.com/polakowo/vectorbt/blob/master/examples/PairsTrading.ipynb"
    rules: "100-day rolling OLS spread of log PEP on log KO; hold the cheap leg when the z-score passes +/-1.96."
    class: EtfWeightBot
    weights: ols_pairs_switch
    schedule: daily
    params: {universe: [PEP, KO], p0: PEP, p1: KO}

  # =========================================================================== final GitHub sweep (13 Oct 2026)
