    rules: "True Strength Index (EMA 25, then EMA 13 of price changes): buy on the first candle below -25, sell on the first candle above +25 (persistence 1). No stop or target. Gekko's default 1-hour candles."
    class: SignalBot
    timeframe: 1h
    signal: gekko_tsi
    variants: crypto8

  gekko_uo:
