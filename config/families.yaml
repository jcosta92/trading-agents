    rules: "Buy when RSI(14) crosses above 30 with TEMA(9) below the Bollinger mid band (20, 2, typical price) and rising; sell when RSI crosses above 70 with TEMA above the mid band and falling. ROI 4% / 2% after 30 min / 1% after 60 min, stop -10%."
    class: SignalBot
    timeframe: 5m
    signal: ft_sample_strategy
    variants: crypto8
    risk: {roi: {0: 0.04, 30: 0.02, 60: 0.01}, stoploss: 0.10}

