    rules: "Buy RSI(14) < 30, slow stochastic %K < 20, close below the lower Bollinger band (20, 2) and a TA-Lib hammer candle; sell when Parabolic SAR is above the close and Fisher RSI > 0.3, only in profit. ROI 5/4/3/1% (0/20/30/60 min), stop -10%."
    class: SignalBot
    timeframe: 5m
    signal: strategy002
    variants: crypto8
    risk: {roi: {0: 0.05, 20: 0.04, 30: 0.03, 60: 0.01}, stoploss: 0.10, exits: [{col: exit, min_profit: 0.0}]}

