    rules: "Buy when EMA12 / EMA26 - 1 is between -1.416% and -1.176%. The published exit band is empty (min > max), so trades end on the ROI table (21.3% / 9.9% after 27 min / 3% after 60 min / 0% after 164 min) or the -31.8% stop."
    class: SignalBot
    timeframe: 5m
    signal: universal_macd
    variants: crypto8
    risk: {roi: {0: 0.213, 27: 0.099, 60: 0.03, 164: 0}, stoploss: 0.318}

