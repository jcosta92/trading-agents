    source: "https://github.com/askmike/gekko/blob/develop/strategies/UO.js (defaults: config/strategies/UO.toml)"
    rules: "Ultimate Oscillator (7/14/28, weights 4/2/1): buy on the first candle below 30, sell on the first candle above 70 (persistence 1). No stop or target. Gekko's default 1-hour candles."
    class: SignalBot
    timeframe: 1h
    signal: gekko_uo
    variants: crypto8

