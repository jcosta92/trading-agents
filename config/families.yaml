    name: "Obelisk Ichimoku Slow v1.3 (Freqtrade community)"
    source: "https://github.com/brookmiles/freqtrade-stuff/blob/main/strategies/Obelisk_Ichimoku_Slow_v1_3.py"
    rules: "A trend state turns on when Ichimoku (20/60/120, displacement 30: tenkan > kijun, close above the cloud, future cloud green, chikou above the cloud), the SSL channel (10, ATR) and EMA50 > EMA200 all agree, and off when the SSL channel turns down. Buy pullbacks in the trend (Elder force index > 0, candle below the SSL top); sell when the trend turns off. No ROI, stop -99%."
    class: SignalBot
    timeframe: 1h
    signal: obelisk_ichimoku_slow
    variants: crypto8
    risk: {stoploss: 0.99}

  rsi_bull_bear:
