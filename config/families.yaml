    name: "RSI Bull and Bear (Gekko, Tommie Hansen)"
    source: "https://github.com/tommiehansen/gekko_tools/blob/master/strategies/RSI_BULL_BEAR.js (parameters: RSI_BULL_BEAR.toml)"
    rules: "SMA50 vs SMA1000 picks the regime. Bull: buy RSI(10) < 60, sell RSI(10) > 80. Bear: buy RSI(15) < 20, sell RSI(15) > 50. No stop or target."
    class: SignalBot
    timeframe: 5m
    signal: rsi_bull_bear
