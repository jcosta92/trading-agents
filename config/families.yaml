    rules: "Heikin-Ashi candles: close above the Ichimoku cloud (20/60/120, displacement 30), close above open on 5 EMA scales (3 to 48), EMA12/EMA96 fan above 1 and rising for 3 candles by at least 0.2%. Sell when the close crosses below EMA24. ROI 5.9/3.7/1.2/0% (0/10/41/114 min), stop -27.5%."
    class: SignalBot
    timeframe: 5m
    signal: ichiv1
    variants: crypto8
    risk: {roi: {0: 0.059, 10: 0.037, 41: 0.012, 114: 0}, stoploss: 0.275}

  obelisk_ichimoku_slow:
