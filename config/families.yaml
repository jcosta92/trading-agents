    rules: "Daily and weekly RSI(30) both above 70 (weekly above daily), SMA10 > SMA20 > SMA50 > SMA100 and the close above SMA10: buy with a stop 8% below; sell when the close is 2% below SMA10. Decided at 15:55 New York time."
    class: EtfDailyBot
    signal: bt_mtf_system
    variants: etf10
    lookback: 1500
    risk: {bracket: true}

  haa:
    group: equity_research
    name: "Hybrid Asset Allocation, balanced (Keller & Keuning 2023)"
    source: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4346906 ; code: https://github.com/SimonKreis/keller-strategies"
    rules: "13612U momentum (average of 1/3/6/12-month returns). TIP <= 0: all in the better of BIL/IEF. Otherwise the top 4 of SPY, IWM, VEA, VWO, VNQ, DBC, IEF, TLT at 25%; a pick with momentum <= 0 goes to the better of BIL/IEF. Monthly."
    class: EtfWeightBot
    weights: haa
    schedule: monthly
    params: {universe: [SPY, IWM, VEA, VWO, VNQ, DBC, IEF, TLT, BIL], signal_tickers: [TIP]}

  aaa:
    group: equity_research
    name: "Adaptive Asset Allocation (Butler, Philbrick, Gordillo & Varadi 2012)"
    source: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2328254 ; code: https://github.com/systematicinvestor/SIT/blob/master/R/bt.test.r (bt.aaa.test)"
    rules: "Top 5 of SPY, EFA, EWJ, EEM, IYR, RWX, IEF, TLT, DBC, GLD by 6-month return, weighted by long-only minimum variance on the last 22 daily returns. Always invested. Monthly."
    class: EtfWeightBot
    weights: aaa
    schedule: monthly
    params: {universe: [SPY, EFA, EWJ, EEM, IYR, RWX, IEF, TLT, DBC, GLD]}

  kda:
    group: equity_research
    name: "Kipnis Defensive Adaptive asset allocation (Kipnis 2019)"
    source: "https://quantstrattrader.com/2019/01/24/right-now-its-kda-asset-allocation/ (R code in the post)"
    rules: "Top 5 of SPY, VGK, EWJ, EEM, VNQ, RWX, IEF, TLT, DBC, GLD by 13612W momentum that are also positive, minimum-variance weights (1-month volatility, blended 1/3/6/12-month correlation); canaries VWO and BND set the risky share to 100/50/0%; the rest in IEF if its momentum is positive, else cash. No leverage. Monthly."
    class: EtfWeightBot
    weights: kda
    schedule: monthly
    params: {universe: [SPY, VGK, EWJ, EEM, VNQ, RWX, IEF, TLT, DBC, GLD], signal_tickers: [VWO, BND]}

  faa:
    group: equity_research
    name: "Flexible Asset Allocation (Keller & van Putten 2012)"
    source: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2193735 ; code: https://github.com/IlyaKipnis/IKTrading/blob/master/R/FAA.R"
    rules: "Over 4 months, rank VTI, VEA, VWO, SHY, BND, GSG, VNQ by return (high best), volatility and average correlation (low best); score = R + 0.5 V + 0.5 C; hold the best 3 at 1/3; a pick with a negative 4-month return goes to SHY. Monthly."
    class: EtfWeightBot
    weights: faa
    schedule: monthly
    params: {universe: [VTI, VEA, VWO, SHY, BND, GSG, VNQ]}

  composite_dual_momentum:
    group: equity_research
    name: "Composite Dual Momentum (Antonacci 2012)"
    source: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2042750 ; code: https://github.com/rubetron/AssetAllocation"
    rules: "Four 25% modules: SPY/EFA, HYG/LQD, VNQ/REM, GLD/TLT. Each holds the asset with the higher 12-month return if it beats T-bills (BIL), else BIL. Monthly."
    class: EtfWeightBot
    weights: composite_dual_momentum
    schedule: monthly
    params: {universe: [SPY, EFA, HYG, LQD, VNQ, REM, GLD, TLT, BIL]}

  accelerating_dual_momentum:
    group: equity_research
    name: "Accelerating Dual Momentum (EngineeredPortfolio 2018)"
    source: "https://engineeredportfolio.com/2018/05/02/accelerating-dual-momentum-investing/ ; code: PyPI package acdumo"
    rules: "Score = 1 + 3 + 6-month return of SPY and SCZ (US vs international small caps); hold the higher one if its score is positive, otherwise long Treasuries (TLT). Monthly."
    class: EtfWeightBot
    weights: accelerating_dual_momentum
    schedule: monthly
    params: {universe: [SPY, SCZ, TLT]}

  hrp:
    group: equity_research
    name: "Hierarchical Risk Parity (Lopez de Prado 2016)"
    source: "https://papers.ssrn.com/abstract=2708678 ; code: https://github.com/robertmartin8/PyPortfolioOpt/blob/master/pypfopt/hierarchical_portfolio.py"
    rules: "Single-linkage clustering of AAA's 10 asset-class ETFs on 260 daily returns, then top-down inverse-variance splits (PyPortfolioOpt HRPOpt). A risk-based benchmark: always invested, no timing. Monthly."
    class: EtfWeightBot
    weights: hrp
    schedule: monthly
    params: {universe: [SPY, EFA, EWJ, EEM, IYR, RWX, IEF, TLT, DBC, GLD]}
