# STRATEGY FAMILIES (added 12-13 Oct 2026; replayed from the common start 12 Oct 17:00 UTC)
# ---------------------------------------------------------------------------------------
# One family = one published strategy. Its bots ("variants") run the SAME rules with the source's
# default parameters on different markets - a robustness grid, not parameter fishing. Nothing was
# tuned on data. A family is judged by how many of its variants make money after costs, not by
# its best variant.
#
# Every bot: EUR 1,000, long only (a short signal = exit to cash), Bitvavo fees for crypto
# (0.15% maker / 0.25% taker + spread/slippage), IBKR fees for US ETFs/stocks.
# Signal at a candle's close -> market order at the next candle's open (as Freqtrade); stop and
# limit orders fill when a later candle trades through them.

