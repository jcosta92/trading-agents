    rules: "With SMA5 >= SMA200, buy when the 5m RSI(14) is 20 points below the RSI(14) of 40-minute candles; sell when the 5m RSI is above both the 10-minute and 40-minute RSI. ROI 1%, stop -5%."
    class: SignalBot
    timeframe: 5m
    signal: multi_rsi
    variants: crypto8
    risk: {roi: {0: 0.01}, stoploss: 0.05}

  volatility_system:
    group: repos
    name: "Volatility System (freqtrade-strategies futures folder, long side)"
    source: "https://github.com/freqtrade/freqtrade-strategies/blob/main/user_data/strategies/futures/VolatilitySystem.py"
    rules: "On 3-hour candles, buy when the close-to-close move exceeds 2 x ATR(14); exit on the same move downwards. Half the stake on entry, the other half on a later fresh signal (adjust_trade_position). Spot at 1x instead of the source's 2x futures leverage; no ROI or stop."
    class: SignalBot
    timeframe: 1h
    signal: volatility_system
    variants: crypto8
    risk: {size: 0.495, scale_in: {col: add, max_entries: 2}}

  nfi_v1:
    group: repos
    name: "NostalgiaForInfinity V1 (the first NFI, iterativ)"
    source: "https://github.com/PeetCrypto/freqtrade-stuff/blob/main/NostalgiaForInfinityV1.py (mirror; the NFI repository's history starts later)"
    rules: "Three dip buys in an uptrend (5m and 1h EMA50 > EMA200): a BinH-style Bollinger (40) dip, a close 0.8% under the lower band (20) on low volume, or RSI 37 points below the 1h RSI with the 1h SSL channel up. Sell on three closes above the upper band, RSI > 78, or close between EMA50 and EMA200 with RSI > 50. ROI 25% (not while RSI > 50), stop -36%, trail 2% after +30%."
    class: SignalBot
    timeframe: 5m
    signal: nfi_v1
    informative: [1h]
    variants: crypto8
    risk: {stoploss: 0.36, trailing: {positive: 0.02, offset: 0.30, only_offset: true},
           exits: [{col: exit}, {col: roi_exit, min_profit: 0.25}]}

  ichiv1:
    group: repos
