    name: "Volatility-scaled SMA timing, BTC SMA65 / ETH SMA20 (Le & Ruthbah, Monash 2024)"
    source: "https://www.monash.edu/__data/assets/pdf_file/0011/3744821/Trend-following-Strategies-for-Crypto-Investors.pdf"
    rules: "Half the capital each in BTC (above SMA65) and ETH (above SMA20), each sized to 30% annual volatility."
    class: WeightBot
    timeframe: 1d
    weights: monash_vol_sma
    universe: [BTC_SPOT, ETH_SPOT]
    schedule: every
    band: 0.05

  rohrbach_trend:
    group: crypto_research
    name: "Normalised multi-horizon EMA trend (Rohrbach, Suremann & Osterrieder 2017)"
    source: "https://www.cxoadvisory.com/momentum-investing/currency-and-cryptocurrency-exchange-rate-momentum-tests/"
    rules: "Three EMA crossovers (8/24, 16/48, 32/96) normalised by volatility, Baz et al. response function; long-only weight per coin."
    class: WeightBot
    timeframe: 1d
    weights: rohrbach_trend
    universe: [BTC_SPOT, ETH_SPOT, SOL_SPOT, XRP_SPOT]
    schedule: every
    band: 0.04

  cs_momentum_3w:
    group: crypto_research
    name: "3-week cross-sectional momentum (Liu, Tsyvinski & Wu 2022)"
    source: "https://www.nber.org/papers/w25882.pdf"
    rules: "Weekly: equal weight in the top 30% of 18 coins by 3-week return (cash for any with a negative return)."
    class: WeightBot
    timeframe: 1d
    weights: cs_momentum
    universe: crypto18
    schedule: weekly
    weekday: 0
    params: {days: 21, top_frac: 0.3, absolute: true}

  vol_managed_momentum:
    group: crypto_research
    name: "Volatility-managed crypto momentum (Grobys et al. 2025)"
    source: "https://osuva.uwasa.fi/items/2b92e591-acb3-445f-b33d-1a943a8972f5/full"
    rules: "The 3-week momentum basket scaled by min(1, 40% / its realised volatility over 4 weeks)."
    class: WeightBot
    timeframe: 1d
    weights: vol_managed_momentum
    universe: crypto18
    schedule: weekly
    weekday: 0

  momentum_2w2w:
    group: crypto_research
    name: "2-week momentum, 2-week hold (Dobrynskaya 2022)"
    source: "https://www.hse.ru/en/news/research/559533243.html"
    rules: "Every 2 weeks, equal weight in the top 5 coins by 14-day return."
    class: WeightBot
    timeframe: 1d
    weights: top_k_return
    universe: crypto18
    schedule: every_n_days
    n_days: 14
    params: {days: 14, k: 5}

  near_week_high:
    group: crypto_research
    name: "Nearness to the 1-week high (Ficura 2023)"
    source: "https://wp.ffu.vse.cz/artkey/wps-202301-0003_impact-of-size-and-volume-on-cryptocurrency-momentum-and-reversal.php"
    rules: "Weekly: hold the 5 coins closest to their 7-day high."
    class: WeightBot
    timeframe: 1d
    weights: near_week_high
    universe: crypto18
    schedule: weekly
    weekday: 0
    params: {k: 5}

  ctrend_proxy:
    group: crypto_research
    name: "CTREND trend factor, simplified (Fieberg et al. 2025, JFQA)"
    source: "https://jfqa.org/wp-content/uploads/2024/09/24955-trend-factor-cross-section-crypto-returns.pdf"
    rules: "Weekly: hold the 4 coins with the best average rank of price / SMA(3...200)."
    class: WeightBot
    timeframe: 1d
    weights: ctrend_proxy
    universe: crypto18
    schedule: weekly
    weekday: 0
    params: {k: 4}

  max_momentum:
    group: crypto_research
    name: "MAX momentum (Li, Urquhart, Wang & Zhang 2021)"
    source: "https://reading-clone.eprints-hosting.org/99101/1/MAX%20Momentum.R1.pdf"
    rules: "Weekly: hold the 3 coins with the highest average of their 5 largest daily returns over 30 days."
    class: WeightBot
    timeframe: 1d
    weights: max_momentum
    universe: crypto18
    schedule: weekly
    weekday: 0
    params: {k: 3}

  lottery_avoidance:
    group: crypto_research
    name: "Lottery avoidance, low-MAX coins (Grobys & Junttila 2021)"
    source: "https://www.uwasa.fi/en/newshub/news/new-study-detects-lottery-behavior-cryptocurrency-markets"
    rules: "Weekly: hold the 6 coins with the lowest maximum daily return over the past week."
    class: WeightBot
    timeframe: 1d
    weights: lottery_avoidance
    universe: crypto18
    schedule: weekly
    weekday: 0
    params: {k: 6}

  weekly_contrarian:
    group: crypto_research
    name: "Weekly contrarian, last week's losers (Kosc, Sakowski & Slepaczuk 2019)"
    source: "https://www.wne.uw.edu.pl/files/2615/2405/6484/WNE_WP268.pdf"
    rules: "Weekly: equal weight in the 5 coins with the worst 7-day return."
    class: WeightBot
    timeframe: 1d
    weights: weekly_contrarian
    universe: crypto18
    schedule: weekly
    weekday: 0
    params: {k: 5}

  low_volume_reversal:
    group: crypto_research
    name: "Low-volume one-day reversal (Bianchi, Babiak & Dickerson 2022)"
    source: "https://www.riksbank.se/globalassets/media/rapporter/working-papers/2022/no.-413-trading-volume-and-liquidity-provision-in-cryptocurreny-markets.pdf"
    rules: "Daily: hold coins in the bottom third by yesterday's return AND the bottom third by volume shock, for one day."
    class: WeightBot
    timeframe: 1d
    weights: low_volume_reversal
    universe: crypto18
    schedule: every

  btc_eth_distance:
    group: crypto_research
    name: "BTC/ETH distance pairs, long-only switch (Fil & Kristoufek 2020)"
    source: "https://ieeexplore.ieee.org/document/9200323"
    rules: "50/50 BTC/ETH; when the 30-day spread z-score passes +/-2, 100% in the cheap leg; back to 50/50 at the zero cross."
    class: WeightBot
    timeframe: 1h
    weights: btc_eth_distance
    universe: [BTC_SPOT, ETH_SPOT]
    schedule: every
    band: 0.05

  # =========================================================================== machine learning / statistics
  gbm_stumps:
    group: ml
    name: "Gradient-boosted stumps on technical features (QuantConnect library + backtesting.py features)"
    source: "https://www.quantconnect.com/learning/articles/investment-strategy-library/gradient-boosting-model"
    rules: "20 depth-1 trees predict the 10-hour return from 13 technical features; retrained every Monday on 4 weeks; buy if the prediction > 0.6%, hold 10 hours."
    class: SignalBot
    timeframe: 1h
    signal: gbm_stumps
    variants: crypto8
    risk: {time_stop: 10}

  knn_direction:
    group: ml
    name: "k-nearest-neighbours direction classifier (backtesting.py ML example)"
    source: "https://github.com/kernc/backtesting.py/blob/master/doc/examples/Trading%20with%20Machine%20Learning.py"
    rules: "7-NN on technical features predicts the 48-hour direction; retrained weekly on 400 bars; buy on 'up' with a 1.5% stop and target."
    class: SignalBot
    timeframe: 1h
    signal: knn_direction
    variants: crypto8
    risk: {bracket: true}

  hmm_regime:
    group: ml
    name: "2-state Gaussian HMM regime filter (Machine Learning for Trading, S. Jansen)"
    source: "https://github.com/stefan-jansen/machine-learning-for-trading (09_model_based_features)"
    rules: "HMM on daily return and 21-day volatility, refit weekly on 3 years; hold while P(calm) > 0.7, out below 0.3 (filtered probabilities, no look-ahead)."
    class: SignalBot
    timeframe: 1d
    signal: hmm_regime
    variants: crypto8

  gnb_cross_section:
    group: ml
    name: "Gaussian Naive Bayes cross-section (QuantConnect library, Lu 2016)"
    source: "https://www.quantconnect.com/learning/articles/investment-strategy-library/gaussian-naive-bayes-model"
    rules: "One model per coin on the last 4 daily returns of all 8 coins; weekly, hold the coins predicted to rise."
    class: WeightBot
    timeframe: 1d
    weights: gnb_cross_section
    universe: crypto8
    schedule: weekly
    weekday: 0

  kalman_pairs:
    group: ml
    name: "Kalman-filter BTC/ETH pairs, long-only switch (Quantopian research, D. Edwards)"
    source: "https://github.com/quantopian/research_public (drafts/kelly/kelly_kalman_pairs.py)"
    rules: "Kalman regression of log ETH on log BTC; |z| > 1.5: 100% in the cheap leg; back to 50/50 at the zero cross or after 20 days."
    class: WeightBot
    timeframe: 4h
    weights: kalman_pairs
    universe: [BTC_SPOT, ETH_SPOT]
    schedule: every
    band: 0.05

  ols_pairs_eth_btc:
    group: ml
    name: "Rolling-OLS z-score pairs ETH/BTC, long-only switch (vectorbt example)"
    source: "https://github.com/polakowo/vectorbt/blob/master/examples/PairsTrading.ipynb"
    rules: "100-day rolling OLS spread of log ETH on log BTC; z < -1.96 hold ETH, z > +1.96 hold BTC."
    class: WeightBot
    timeframe: 1d
    weights: ols_pairs_switch
    universe: [ETH_SPOT, BTC_SPOT]
    params: {p0: ETH_SPOT, p1: BTC_SPOT}
    schedule: every

  half_kelly:
    group: ml
    name: "Half-Kelly position sizing (Quantopian KellyLeverage, long only)"
    source: "https://github.com/quantopian/research_public (drafts/kelly)"
    rules: "Weight = clip(0.5 x mean / variance of 120 daily log returns, 0, 1); rebalanced when it moves by 0.2."
    class: WeightBot
    timeframe: 1d
    weights: half_kelly
    variants: [BTC_SPOT, ETH_SPOT, SOL_SPOT]
    schedule: every
    band: 0.2

  # =========================================================================== stock and ETF research
  etf_rsi2:
    group: equity_research
    name: "Connors RSI(2) pullback (Connors & Alvarez 2008)"
    source: "https://chartschool.stockcharts.com/table-of-contents/trading-strategies-and-models/trading-strategies/rsi-2"
    rules: "Above the 200-day SMA, buy RSI(2) <= 5 at 15:55; sell a close above the 5-day SMA."
    class: EtfDailyBot
    signal: etf_rsi2
    variants: etf10

  etf_cumulative_rsi:
    group: equity_research
    name: "Cumulative RSI (Connors & Alvarez)"
    source: "https://www.prorealcode.com/prorealtime-trading-strategies/cumulative-rsi-2-periods-strategy"
    rules: "Above the 200-day SMA, buy when RSI(2) today + yesterday < 35; sell when > 65."
    class: EtfDailyBot
    signal: etf_cumulative_rsi
    variants: etf10

  etf_r3:
    group: equity_research
    name: "R3 strategy (Connors, High Probability ETF Trading 2009)"
    source: "https://quantifiedstrategies.substack.com/p/larry-connors-r3-strategy-it-still-795"
    rules: "Above the 200-day SMA, RSI(2) falling 3 days from below 60 and now below 10: buy; sell RSI(2) > 70."
    class: EtfDailyBot
    signal: etf_r3
    variants: etf10

  etf_pct_b:
    group: equity_research
    name: "%b strategy (Connors 2009)"
    source: "https://de.tradingview.com/script/yXkWPSlU"
    rules: "Above the 200-day SMA with Bollinger %b (5, 1) below 0.2 for 3 days: buy; sell %b > 0.8."
    class: EtfDailyBot
    signal: etf_pct_b
    variants: etf10

  etf_tps:
    group: equity_research
    name: "TPS: time, price, scale-in (Connors 2009)"
    source: "https://wl6.wealth-lab.com/Forum/Posts/Connors-TPS-Strategy-40197"
    rules: "Above the 200-day SMA with RSI(2) < 25 two days: buy 10%; add 20/30/40% on each lower close; sell all at RSI(2) > 70."
    class: TPSBot
    signal: etf_tps
    variants: etf10

  etf_3day_high_low:
    group: equity_research
    name: "3-day high/low (Connors 2009)"
    source: "https://quantifiedstrategies.substack.com/p/larry-connors-3-day-highlow-method-4f3"
    rules: "Above SMA200, below SMA5, 3 lower highs and lower lows: buy; sell above SMA5."
    class: EtfDailyBot
    signal: etf_3day_high_low
    variants: etf10

  etf_double_7s:
    group: equity_research
    name: "Double 7s (Connors & Alvarez)"
    source: "https://strategyquant.com/blog/larry-connors-double-7-strategy-tested-on-spy-and-8-other-markets/"
    rules: "Above SMA200, a 7-day closing low: buy; a 7-day closing high: sell."
    class: EtfDailyBot
    signal: etf_double_7s
    variants: etf10

  etf_multiple_days_down:
    group: equity_research
    name: "Multiple days down (Connors 2009)"
    source: "https://quantifiedstrategies.substack.com/p/larry-connors-multiple-days-up-and-d41"
    rules: "Down 4 of the last 5 days, above SMA200 and below SMA5: buy; sell above SMA5."
    class: EtfDailyBot
    signal: etf_multiple_days_down
    variants: etf10

  etf_vix_stretch:
    group: equity_research
    name: "VIX stretch (Connors & Alvarez 2008)"
    source: "Connors & Alvarez, Short Term Trading Strategies That Work (2008)"
    rules: "VIX at least 5% above its 10-day average for 3 days (prior closes) and the ETF above SMA200: buy; sell RSI(2) > 65."
    class: EtfDailyBot
    signal: etf_vix_stretch
    variants: etf3
    params: {extra_tickers: ["^VIX"]}

  noise_area_momentum:
    group: equity_research
    name: "Noise-area intraday momentum (Zarattini, Aziz & Barbon 2024, 'Beat the Market')"
    source: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4824172"
    rules: "Long when the price breaks above the noise area (open x (1 + 14-day average move at that time)), checked at :00/:30; exit below max(bound, VWAP); flat by the close."
    class: IntradayEtfBot
    signal: noise_area_momentum
    variants: etf3
    intraday_days: 30

  vwap_trend:
    group: equity_research
    name: "VWAP trend day trading (Zarattini & Aziz 2023)"
    source: "https://concretumgroup.com/volume-weighted-average-price-vwap-the-holy-grail-for-day-trading-systems/"
    rules: "Long while the 5-minute close is above the session VWAP, flat below it and at the close."
    class: IntradayEtfBot
    signal: vwap_trend
    variants: [QQQ, SPY, IWM]

  intraday_momentum_gao:
    group: equity_research
    name: "Market intraday momentum: first half-hour predicts the last (Gao et al. 2018, JFE)"
    source: "https://profiles.wustl.edu/en/publications/market-intraday-momentum/"
    rules: "If the return from the prior close to 10:00 is positive, buy at 15:30 and sell at the close."
    class: IntradayEtfBot
    signal: intraday_momentum_gao
    variants: etf3
    intraday_days: 5

  pre_fomc_drift:
    group: equity_research
    name: "Pre-FOMC announcement drift (Lucca & Moench 2015)"
    source: "Lucca & Moench (2015), Journal of Finance 70(1); FOMC decisions 28 Oct and 9 Dec 2026 (federalreserve.gov calendar)"
    rules: "Buy SPY at 15:55 the day before an FOMC decision; sell at 13:55 on decision day."
    class: PreFomcBot
    variants: [SPY]
    params: {decision_days: ["2026-10-28", "2026-12-09"]}

  gtaa:
    group: equity_research
    name: "Faber GTAA: 5 asset classes above their 200-day average (Faber 2007)"
    source: "https://concretumgroup.substack.com/p/global-tactical-asset-allocation"
    rules: "20% each in SPY, EFA, IEF, DBC, VNQ when above the 200-day SMA, else T-bills (BIL); rebalanced at month-end."
    class: EtfWeightBot
    weights: gtaa
    schedule: monthly
    params: {universe: [SPY, EFA, IEF, DBC, VNQ, BIL]}

  gem:
    group: equity_research
    name: "Global Equities Momentum / dual momentum (Antonacci 2014)"
    source: "https://api.advisorperspectives.com/articles/2019/05/06/global-equity-momentum-a-craftsmans-perspective"
    rules: "Month-end: if SPY's 12-month return beats T-bills, hold the better of SPY and VEU, else bonds (AGG)."
    class: EtfWeightBot
    weights: gem
    schedule: monthly
    params: {universe: [SPY, VEU, AGG, BIL]}

  vaa_g4:
    group: equity_research
    name: "Vigilant Asset Allocation G4 (Keller & Keuning 2017)"
    source: "https://cxoadvisory.com/?p=30082"
    rules: "13612W momentum; if SPY, EFA, EEM and AGG are all positive hold the best, else the best of SHY, IEF, LQD."
    class: EtfWeightBot
    weights: vaa_g4
    schedule: monthly
    params: {universe: [SPY, EFA, EEM, AGG, SHY, IEF, LQD]}

  daa_g12:
    group: equity_research
    name: "Defensive Asset Allocation G12 (Keller & Keuning 2018)"
    source: "https://www.cxoadvisory.com/strategic-allocation/multi-class-momentum-portfolio-with-canary-crash-protection/"
    rules: "Canaries VWO/BND set 0/50/100% cash (best of SHY, IEF, LQD); the rest in the top 6 of 12 risky ETFs."
    class: EtfWeightBot
    weights: daa_g12
    schedule: monthly
    params: {universe: [SPY, IWM, QQQ, VGK, EWJ, VWO, VNQ, DBC, GLD, TLT, HYG, LQD, SHY, IEF, BND]}

  baa_g4:
    group: equity_research
    name: "Bold Asset Allocation, aggressive G4 (Keller 2022)"
    source: "https://thechartist.com.au/wp-content/uploads/2024/12/5369/SSRN-id4166845.pdf"
    rules: "Canaries SPY/VWO/VEA/BND; offensive top-1 of QQQ/VWO/VEA/BND by SMA12 momentum; defensive top-3 of TIP/DBC/BIL/IEF/TLT/LQD/BND."
    class: EtfWeightBot
    weights: baa_g4
    schedule: monthly
    params: {universe: [QQQ, VWO, VEA, BND, TIP, DBC, BIL, IEF, TLT, LQD, SPY]}

  paa:
    group: equity_research
    name: "Protective Asset Allocation (Keller & Keuning 2016)"
    source: "https://www.quantconnect.com/forum/discussion/3152"
    rules: "12 risky ETFs; bond share from how many have negative 12-month SMA momentum (a = 2); the rest in the top 6."
    class: EtfWeightBot
    weights: paa
    schedule: monthly
    params: {universe: [SPY, QQQ, IWM, VGK, EWJ, EEM, VNQ, DBC, GLD, TLT, HYG, LQD, IEF]}

  sector_momentum:
    group: equity_research
    name: "Sector momentum rotation, top 3 of 11 (Faber 2010)"
    source: "https://quantpedia.com/strategies/sector-momentum-rotational-system"
    rules: "Month-end: hold the 3 US sector ETFs with the best 12-month return."
    class: EtfWeightBot
    weights: sector_momentum
    schedule: monthly
    params: {universe: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, XLC, XLRE], k: 3}

  industry_trend:
    group: equity_research
    name: "Industry trend following on sector ETFs (Zarattini & Antonacci 2024)"
    source: "https://arxiv.org/html/2412.14361v1"
    rules: "Enter at the upper band (min of 20-day Donchian high and a Keltner band), ratcheting stop; each ETF sized to 1% daily volatility; max 100% invested."
    class: EtfWeightBot
    weights: industry_trend
    schedule: daily
    band: 0.03
    params: {universe: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, XLC, XLRE, SMH, XBI, KRE, ITB, XME, XRT, IYT, IBB, KIE]}

  ath_trend:
    group: equity_research
    name: "All-time-high trend following on large US stocks (Zarattini, Pagani & Wilcox 2025)"
    source: "https://cxoadvisory.com/momentum-investing/all-time-high-trend-following"
    rules: "Buy a stock at a new all-time closing high; exit below the highest close since entry minus 10 ATR(42); max 10 positions of 10%."
    class: EtfWeightBot
    weights: ath_trend
    schedule: daily
    band: 0.03
    lookback: 2600
    params: {universe: megacaps40}

  volatility_edge:
    group: equity_research
    name: "The Volatility Edge: VIX ETN regimes (Zarattini, Aziz & Mele 2025)"
    source: "https://concretumgroup.substack.com/p/automating-a-volatility-strategy"
    rules: "Long SVXY (short volatility) in contango, long VXX in backwardation with a negative volatility premium; weight VIX/100."
    class: EtfWeightBot
    weights: volatility_edge
    schedule: daily
    band: 0.02
    params: {universe: [SVXY, VXX], signal_tickers: [SPY, "^VIX", "^VIX3M"]}

  vol_managed_spy:
    group: equity_research
    name: "Volatility-managed S&P 500 (Moreira & Muir 2017; Harvey et al. 2018)"
    source: "https://alphaarchitect.com/volatility-targeting-improves-risk-adjusted-returns/"
    rules: "SPY weight = min(1, 15% / 20-day realised volatility), the rest in BIL; rebalanced when it moves 10 points."
    class: EtfWeightBot
    weights: vol_managed_spy
    schedule: daily
    band: 0.10
    params: {universe: [SPY, BIL]}

  lowvol_leveraged:
    group: equity_research
    name: "3x S&P (SPXL) only in low-volatility regimes (Quantpedia 2025)"
    source: "https://quantpedia.com/leveraged-etfs-in-low-volatility-environments/"
    rules: "Hold SPXL while the VIX's moving average is above SPY's realised volatility, else cash."
    class: EtfWeightBot
    weights: lowvol_leveraged
    schedule: daily
    variants:
      - {id: rv10_vix60, params: {universe: [SPXL], signal_tickers: [SPY, "^VIX"], rv: 10, vix_sma: 60}}
      - {id: rv20_vix60, params: {universe: [SPXL], signal_tickers: [SPY, "^VIX"], rv: 20, vix_sma: 60}}

  treasury_month_end:
    group: equity_research
    name: "Treasury month-end effect, TLT (Beyond Passive / Robot Wealth 2025)"
    source: "https://beyondpassive.substack.com/p/two-calendar-effects-at-the-month"
    rules: "Hold TLT from the close 5 trading days before month-end to the month-end close."
    class: EtfWeightBot
    weights: treasury_month_end
    schedule: daily
    params: {universe: [TLT]}

  month_end_reversal:
    group: equity_research
    name: "Month-end rebalancing reversal, VTI / TBF (Beyond Passive 2025)"
    source: "https://beyondpassive.substack.com/p/two-calendar-effects-at-the-month"
    rules: "If bonds beat stocks over the first 15 trading days, hold VTI over the last 5; if stocks led, hold TBF over the next month's first 5."
    class: EtfWeightBot
    weights: month_end_reversal
    schedule: daily
    params: {universe: [VTI, TBF], signal_tickers: [TLT]}

  holiday_seasonality:
    group: equity_research
    name: "Thanksgiving AMZN and Christmas gold (Quantpedia 2025)"
    source: "https://quantpedia.com/thanksgiving-and-christmas-trading-strategies/"
    rules: "AMZN from 5 trading days before Thanksgiving to 3 after; GLD from 23 December."
    class: EtfWeightBot
    weights: holiday_seasonality
    schedule: daily
    params: {universe: [AMZN, GLD]}

  pre_holiday:
    group: equity_research
    name: "Pre-holiday effect (QuantConnect Strategy Library)"
    source: "https://www.quantconnect.com/learning/articles/investment-strategy-library/pre-holiday-effect"
    rules: "Hold SPY when an exchange holiday falls within the next 2 calendar days."
    class: EtfWeightBot
    weights: pre_holiday
    schedule: daily
    params: {universe: [SPY]}

  opex_week:
    group: equity_research
    name: "Option-expiration week effect, OEF (QuantConnect Strategy Library)"
    source: "https://www.quantconnect.com/learning/articles/investment-strategy-library/option-expiration-week-effect"
    rules: "Hold OEF from the Monday of the monthly expiration week until expiration day."
    class: EtfWeightBot
    weights: opex_week
    schedule: daily
    params: {universe: [OEF]}

  lunar_cycle:
    group: equity_research
    name: "Lunar cycle (QuantConnect Strategy Library) - a calendar control"
    source: "https://www.quantconnect.com/learning/articles/investment-strategy-library/lunar-cycle-in-equity-market"
    rules: "Long from the last quarter moon to the first quarter (around the new moon), cash around the full moon."
    class: EtfWeightBot
    weights: lunar_cycle
    schedule: daily
    variants:
      - {id: EEM, params: {universe: [EEM]}}
      - {id: SPY, params: {universe: [SPY]}}

  pep_ko_pairs:
