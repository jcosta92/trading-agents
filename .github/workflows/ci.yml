name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["state/**", "docs/**", "reports/**", "data/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest -q
      - run: python -m quantdesk.cli selftest
