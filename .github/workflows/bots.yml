name: bots
# The trading loop. Runs for ~5h40m, then starts its own next run, so it keeps going without
# depending on GitHub's scheduler (which has not fired for this repository). Every 15 minutes:
#   - the trading bots replay every candle that closed since the last cycle (orders, fills, P&L)
#   - the bots' state and the dashboard go to the single-commit branch `bot-state` (served by
#     GitHub Pages), so ~900 ledgers updated every cycle do not bloat the repository
#   - once an hour, one paper cycle of the research agents (committed to main as before)
#   - on weekdays from 12:13 UTC, today's headline inbox for the LLM news agent, if missing
# Minutes are free for public repositories. The cron line is only a backup to restart the chain.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */4 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Restore the bots' state
        run: .github/scripts/restore_state.sh state/bots
      - name: Trading loop
        shell: bash
        env:
          QD_CACHE: ${{ runner.temp }}/qd-cache
        run: |
          stop_at=$(( $(date +%s) + 20400 ))          # 5h40m
          last_paper=""
          last_news=""
          mkdir -p state/logs
          while [ "$(date +%s)" -lt "$stop_at" ]; do
            git pull -q --rebase || git rebase --abort 2>/dev/null || true
            mkdir -p state/bots/logs
            log="state/bots/logs/bots-$(date -u +%Y-%m-%d).log"
            echo "===== $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$log"
            timeout 1500 python -m quantdesk.cli bots --docs site >> "$log" 2>&1 || echo "::warning::bots cycle reported errors (see $log)"
            .github/scripts/push_state.sh "Bots state $(date -u +%Y-%m-%dT%H:%MZ)" mirror:state/bots:state/bots \
              copy:docs/classic.html:docs/classic.html \
              copy:docs/backtest.html:docs/backtest.html copy:site:docs copy:reports/BOTS.md:reports/BOTS.md || true
            hour=$(date -u +%Y-%m-%dT%H)
            enabled=$(python -c "import yaml;print(bool(yaml.safe_load(open('config/agents.yaml'))['paper'].get('enabled')))")
            # Today's headline inbox for the LLM news agent. The news workflow's cron is not reliable
            # here (12 Oct's 12:13 UTC run started at 21:16; 13 Oct's never started), so the loop builds
            # it too: weekdays from 12:13 UTC, one try per hour until the file exists. The command skips
            # NYSE holidays; the news workflow does nothing once the inbox exists.
            hm=$(date -u +%H%M)
            if [ "$enabled" = "True" ] && [ "$(date -u +%u)" -le 5 ] && [ "$hm" -ge 1213 ] && [ "$hm" -lt 2000 ] \
                && [ ! -f "state/llm/inbox/$(date -u +%Y-%m-%d).json" ] && [ "$hour" != "$last_news" ]; then
              nlog="state/logs/$(date -u +%Y-%m-%d).log"
              echo "===== news inbox $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$nlog"
              timeout 900 python -m quantdesk.cli -v news-inbox >> "$nlog" 2>&1 || echo "::warning::news inbox reported errors"
              last_news="$hour"
            fi
            if [ "$enabled" = "True" ] && [ "$hour" != "$last_paper" ] && [ "$(date -u +%M)" -ge 5 ]; then
              plog="state/logs/$(date -u +%Y-%m-%d).log"
              echo "===== $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$plog"
              timeout 600 python -m quantdesk.cli -v paper >> "$plog" 2>&1 || echo "::warning::paper cycle reported errors"
              last_paper="$hour"
            fi
            .github/scripts/commit_push.sh "Research agents $(date -u +%Y-%m-%dT%H:%MZ)" state docs/classic.html reports || true
            # sleep until 2 minutes past the next quarter hour (candles are closed and published by then)
            now=$(date +%s); next=$(( (now / 900 + 1) * 900 + 120 ))
            [ "$next" -lt "$stop_at" ] && sleep $(( next - now )) || break
          done
      - name: Publish log tail on failure
        if: failure()
        shell: bash
        run: .github/scripts/annotate_tail.sh "state/bots/logs/bots-$(date -u +%Y-%m-%d).log" 60
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(python -c "import yaml;print(yaml.safe_load(open('config/bots.yaml'))['end'])")
          if [ "$(date -u +%s)" -lt "$(( $(date -u -d "$end" +%s) + 7200 ))" ]; then
            gh workflow run bots.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "test period over - not restarting"
          fi
