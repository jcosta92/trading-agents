name: news
# Builds today's headline inbox for the LLM news agent (state/llm/inbox/<date>.json): headlines
# since the previous inbox for the 100 most liquid S&P 500 names. 12:13 UTC is after the usual
# 7:00-8:00 ET pre-market earnings releases. A scheduled Claude task labels it from ~13:13 UTC
# (config/llm_prompt.md; it waits for a late inbox) - no paid API. The first possible US trade is
# the 14:07 UTC cycle (15:07 in winter). The second cron is a fallback in case GitHub skips the
# first run; the command does nothing if today's inbox already exists or if the NYSE is closed.
on:
  schedule:
    - cron: "13 12 * * 1-5"
    - cron: "43 12 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's inbox even if it exists"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Check paper.enabled
        id: flag
        run: |
          pip install -q PyYAML==6.0.3
          python -c "import yaml;print('enabled=' + str(bool(yaml.safe_load(open('config/agents.yaml'))['paper'].get('enabled'))).lower())" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.flag.outputs.enabled == 'true'
        run: pip install -r requirements.txt && pip install -e .
      - name: Build inbox
        if: steps.flag.outputs.enabled == 'true'
        run: python -m quantdesk.cli -v news-inbox ${{ inputs.force && '--force' || '' }}
      - name: Commit inbox
        if: steps.flag.outputs.enabled == 'true'
        shell: bash
        run: .github/scripts/commit_push.sh "News inbox $(date -u +%Y-%m-%d)" state/llm
