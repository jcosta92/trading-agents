name: backtest
# Downloads full history (Yahoo, Kraken/Hyperliquid/Binance funding, S&P 500 membership),
# runs every pre-registered agent at 0x/1x/2x costs and commits data + reports.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/backtest-trigger"]
permissions:
  contents: write
concurrency:
  group: backtest               # separate from the hourly paper run (different files), so stops keep being checked
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Fetch history
        shell: bash
        run: |
          mkdir -p reports/backtest
          python -m quantdesk.cli -v fetch-history 2>&1 | tee reports/backtest/fetch.log
      - name: Run backtests
        shell: bash
        run: python -m quantdesk.cli -v backtest 2>&1 | tee reports/backtest/run.log
      - name: Job summary
        if: always()
        run: cat reports/backtest/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish log tails on failure
        if: failure()
        shell: bash
        run: |
          .github/scripts/annotate_tail.sh reports/backtest/fetch.log 25
          .github/scripts/annotate_tail.sh reports/backtest/run.log 60
      - name: Commit data and results
        if: always()
        shell: bash
        run: .github/scripts/commit_push.sh "Backtest results $(date -u +%Y-%m-%dT%H:%MZ)" reports docs data/history
