name: backtest
# Downloads full history (Yahoo, Kraken/Hyperliquid/Binance funding, S&P 500 membership),
# runs every pre-registered agent at 0x/1x/2x costs and commits data + reports.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/backtest-trigger"]
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Fetch history
        shell: bash
        run: |
          mkdir -p reports/backtest
          python -m quantdesk.cli -v fetch-history 2>&1 | tee reports/backtest/fetch.log
      - name: Run backtests
        shell: bash
        run: python -m quantdesk.cli -v backtest 2>&1 | tee reports/backtest/run.log
      - name: Job summary
        if: always()
        run: cat reports/backtest/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit data and results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data/history -type f -size +90M -print -delete || true
          git add -A reports docs data/history
          git commit -m "Backtest results $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
