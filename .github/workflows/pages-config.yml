name: pages-config
# One-off: serve GitHub Pages from the bot-state branch (/docs), where the trading loop publishes
# the dashboard. Run manually; harmless to re-run.
on:
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(gh api repos/${{ github.repository }}/pages --jq '.source' 2>&1 | tr '\n' ' ')
          echo "::notice::before: $before"
          out=$(gh api -X PUT repos/${{ github.repository }}/pages -f "source[branch]=bot-state" -f "source[path]=/docs" 2>&1 | tr '\n' ' ')
          echo "::notice::update: $out"
          after=$(gh api repos/${{ github.repository }}/pages --jq '.source' 2>&1 | tr '\n' ' ')
          echo "::notice::after: $after"
