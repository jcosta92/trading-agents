name: paper
# One paper-trading cycle for every agent, every hour (GitHub Actions minutes are free and
# unlimited for public repositories). Each cycle:
#   - checks every stop-loss / take-profit / time exit against live prices (markets that are open)
#   - runs each strategy's indicator rules once per day on completed daily bars
#   - commits the ledgers and rebuilds the dashboard (docs/, served by GitHub Pages)
# Scheduled runs can be delayed or skipped by GitHub under load; nothing depends on exact timing.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Check paper.enabled
        id: flag
        run: |
          pip install -q PyYAML==6.0.3
          python -c "import yaml;print('enabled=' + str(bool(yaml.safe_load(open('config/agents.yaml'))['paper'].get('enabled'))).lower())" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.flag.outputs.enabled == 'true'
        run: pip install -r requirements.txt && pip install -e .
      - name: Paper-trading cycle
        if: steps.flag.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p state/logs
          log="state/logs/$(date -u +%Y-%m-%d).log"
          echo "===== $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$log"
          python -m quantdesk.cli -v paper 2>&1 | tee -a "$log"
          exit "${PIPESTATUS[0]}"
      - name: Job summary
        if: always() && steps.flag.outputs.enabled == 'true'
        run: cat reports/STATUS.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit state and dashboard
        if: always() && steps.flag.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state docs reports/STATUS.md
          git commit -q -m "Paper cycle $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*5)); done
