<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading bots: preview</title>
<style>:root{color-scheme:light dark}body{margin:0;padding:24px 16px;font:15px/1.5 system-ui,sans-serif;background:#f9f9f7;color:#0b0b0b}
@media (prefers-color-scheme:dark){body{background:#0d0d0d;color:#f0efec}}a{color:#2a78d6}</style></head>
<body><p id="m">Loading the latest dashboard&hellip;</p>
<script>
// The trading loop publishes this page every 15 minutes to the branch `bot-state` (one commit,
// replaced each time, so the repository does not grow). This stub loads the latest version.
const SRC = "https://raw.githubusercontent.com/jcosta92/trading-agents/bot-state/docs/preview.html";
fetch(SRC + "?t=" + Date.now(), {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(t => { document.open(); document.write(t); document.close(); })
  .catch(e => { document.getElementById("m").innerHTML = "Could not load the dashboard (" + e +
    "). The page is also on <a href='https://github.com/jcosta92/trading-agents/blob/bot-state/docs/preview.html'>GitHub</a>."; });
</script></body></html>
